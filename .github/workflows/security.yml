name: Security

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Review dependencies
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0

  vulnerabilities-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Set up Go
        uses: actions/setup-go@0a12ed9d6a96ab950c8f026ed9f722fe0da7ef32 # v5.0.2
        with:
          go-version: stable
      - name: Check every Go module for vulnerabilities
        shell: bash
        run: |
          while IFS= read -r -d '' module; do
            module_dir=${module%/go.mod}
            package_list=$(
              (
                cd -- "$module_dir"
                GOWORK=off go list ./...
              )
            )
            if [ -n "$package_list" ]; then
              (
              cd -- "$module_dir"
                GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -test ./...
              )
            fi
          done < <(find . -name go.mod -type f -not -path './.git/*' -not -path './node_modules/*' -not -path './vendor/*' -print0)
      - name: Generate an SBOM for every Go module
        shell: bash
        run: |
          mkdir -p sbom
          module_count=0
          while IFS= read -r -d '' module; do
            module_dir=${module%/go.mod}
            package_list=$(
              (
                cd -- "$module_dir"
                GOWORK=off go list ./...
              )
            )
            if [ -n "$package_list" ]; then
              module_count=$((module_count + 1))
              (
                cd -- "$module_dir"
                GOWORK=off go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 mod -output "$GITHUB_WORKSPACE/sbom/go-${module_count}.cdx.json"
              )
            fi
          done < <(find . -name go.mod -type f -not -path './.git/*' -not -path './node_modules/*' -not -path './vendor/*' -print0)
          test "$module_count" -gt 0
          artifact_count=$(find sbom -type f -name '*.cdx.json' | wc -l | tr -d ' ')
          test "$module_count" -eq "$artifact_count"
      - name: Upload SBOMs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cyclonedx-sboms
          path: sbom
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan Git history for secrets
        run: gitleaks git . --redact --no-banner
