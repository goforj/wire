name: Security

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Review dependencies
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0

  vulnerabilities-and-sbom:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
      - name: Check every Go module for vulnerabilities
        shell: bash
        run: |
          while IFS= read -r -d '' module; do
            module_dir=${module%/go.mod}
            package_list=$(
              (
                cd -- "$module_dir"
                GOWORK=off go list ./...
              )
            )
            if [ -n "$package_list" ]; then
              (
              cd -- "$module_dir"
                GOWORK=off go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 -test ./...
              )
            fi
          done < <(find . -name go.mod -type f -not -path './.git/*' -not -path './node_modules/*' -not -path './vendor/*' -print0)
      - name: Generate an SBOM for every Go module
        shell: bash
        run: |
          mkdir -p sbom
          module_count=0
          while IFS= read -r -d '' module; do
            module_dir=${module%/go.mod}
            package_list=$(
              (
                cd -- "$module_dir"
                GOWORK=off go list ./...
              )
            )
            if [ -n "$package_list" ]; then
              module_count=$((module_count + 1))
              (
                cd -- "$module_dir"
                GOWORK=off go run github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.9.0 mod -json -type library -test -output "$GITHUB_WORKSPACE/sbom/go-${module_count}.cdx.json"
              )
            fi
          done < <(find . -name go.mod -type f -not -path './.git/*' -not -path './node_modules/*' -not -path './vendor/*' -print0)
          test "$module_count" -gt 0
          for artifact in sbom/*.cdx.json; do
            jq -e '.bomFormat == "CycloneDX" and .metadata.component.type == "library" and all(.components[]?; .name != "..")' "$artifact" >/dev/null
          done
          artifact_count=$(find sbom -type f -name '*.cdx.json' -size +0c | wc -l | tr -d ' ')
          test "$module_count" -eq "$artifact_count"
      - name: Upload SBOMs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cyclonedx-sboms
          path: sbom
          if-no-files-found: error

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout complete history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Gitleaks
        run: |
          GOBIN="$RUNNER_TEMP/gitleaks" go install github.com/zricethezav/gitleaks/v8@v8.30.1
      - name: Scan Git history for secrets
        run: |
          "$RUNNER_TEMP/gitleaks/gitleaks" git . --redact --no-banner
